# Publică versiunea web (PWA pentru iPhone) pe GitHub Pages la fiecare push pe main
# și la fiecare tag „v*”. Adresa: https://<cont>.github.io/portofoliu-bursa/
#
# Setare unică în depozit: Settings -> Pages -> Source: „GitHub Actions”. Dacă mediul „github-pages”
# are reguli de ramuri, adaugă și tagurile „v*” (Settings -> Environments -> github-pages).
name: Pages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
        env:
          WEB_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
